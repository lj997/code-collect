server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/code_collect?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: test
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

jwt:
  secret: codeCollectSecretKeyForJwtTokenGeneration2024
  expiration: 86400000  # 24小时

logging:
  level:
    com.codecollect: DEBUG
    org.springframework.security: INFO